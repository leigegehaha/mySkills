<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok Image Gen Lab</title>
  <style>
    :root { --bg:#07111f; --panel:rgba(10,19,35,.72); --panel-strong:rgba(14,25,47,.92); --line:rgba(140,185,255,.18); --text:#e8f1ff; --muted:#94a9c9; --accent:#7dd3fc; --accent-2:#c084fc; --shadow:0 18px 60px rgba(0,0,0,.35); }
    *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:"SF Pro Display","PingFang SC","Hiragino Sans GB",sans-serif;background:radial-gradient(circle at top left, rgba(125,211,252,.18), transparent 28%),radial-gradient(circle at top right, rgba(192,132,252,.15), transparent 26%),linear-gradient(180deg,#08111f 0%,#04070d 100%);min-height:100vh}
    .shell{max-width:1440px;margin:0 auto;padding:28px}.hero{display:grid;grid-template-columns:1.05fr 1.3fr;gap:22px;align-items:stretch}.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);border-radius:28px;box-shadow:var(--shadow)}.control{padding:26px;position:sticky;top:24px;align-self:start}
    .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:10px} h1{margin:0;font-size:clamp(34px,5vw,58px);line-height:.95;letter-spacing:-.04em}.lead{margin:16px 0 24px;color:var(--muted);font-size:15px;line-height:1.8}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.meta-card{padding:14px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}.meta-card span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;margin-bottom:8px}.meta-card strong{font-size:14px;color:var(--text)}
    label{display:block;margin:18px 0 8px;font-size:13px;color:#c8d7ef} textarea,input,select{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:18px;padding:14px 16px;outline:none;font-size:14px} textarea{min-height:188px;resize:vertical;line-height:1.7}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:12px;margin-top:20px;align-items:center;flex-wrap:wrap} button{border:0;border-radius:999px;padding:14px 18px;font-size:14px;cursor:pointer;transition:transform .18s ease,opacity .18s ease} button:hover{transform:translateY(-1px)} button:disabled{opacity:.5;cursor:not-allowed}
    .primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#05111f;font-weight:700;min-width:140px}.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.08)}.mini{padding:10px 12px;font-size:12px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.08)}
    .status{color:var(--muted);font-size:13px;min-height:20px}.gallery{padding:18px;display:grid;gap:18px;align-content:start}.stream-header{display:flex;justify-content:space-between;align-items:center;padding:10px 6px 0}.stream-header h2{margin:0;font-size:18px;letter-spacing:-.03em}.stream-header p{margin:0;color:var(--muted);font-size:13px}
    .cards{column-count:2;column-gap:18px}.card{break-inside:avoid;margin-bottom:18px;padding:14px;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:var(--panel-strong);overflow:hidden;box-shadow:0 14px 42px rgba(0,0,0,.22)}.card img{width:100%;border-radius:18px;display:block;margin-bottom:12px;background:rgba(255,255,255,.04)}
    .thumb{width:100%;max-width:220px;border-radius:18px;display:none;margin-top:12px;border:1px solid rgba(255,255,255,.08)}.prompt{font-size:14px;line-height:1.7;margin-bottom:8px;color:#f4f7ff}.meta-line{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.empty{min-height:300px;display:grid;place-items:center;border:1px dashed rgba(125,211,252,.18);border-radius:24px;color:var(--muted);text-align:center;padding:20px}
    @media (max-width:1080px){.hero{grid-template-columns:1fr}.control{position:static}.cards{column-count:1}}
  </style>
</head>
<body>
  <div class="shell"><div class="hero">
    <section class="panel control">
      <div class="eyebrow">VectorEngine × Grok</div>
      <h1>Image Gen Lab</h1>
      <p class="lead">本地目录授权版。首次填入 API Key 后会自动保存到 `localStorage`，以后刷新页面无需重复填写。你可以授权一个本地目录，后续生成的图片会自动保存到该目录；历史记录可直接基于本地保存的图片继续编辑。</p>
      <div class="meta"><div class="meta-card"><span>Model</span><strong>grok-4.2-image</strong></div><div class="meta-card"><span>Auth</span><strong>localStorage</strong></div><div class="meta-card"><span>History</span><strong>继续编辑</strong></div></div>
      <label for="apiBase">API Base URL</label><input id="apiBase" value="https://api.vectorengine.ai" />
      <label for="apiKey">API Key</label><input id="apiKey" type="password" placeholder="首次填写一次，之后自动记住" />
      <label for="mode">模式</label><select id="mode"><option value="t2i">文生图</option><option value="i2i">图生图 / 图片编辑</option></select>
      <label for="prompt">提示词 Prompt</label><textarea id="prompt">加一只小鸭，并保持画面自然协调。</textarea>
      <label for="imageInput">输入图片（图生图 / 编辑时使用）</label><input id="imageInput" type="file" accept="image/*" /><div id="imageState" class="status" style="margin-top:8px;">尚未载入图片。</div><img id="preview" class="thumb" alt="preview" />
      <div class="row"><div><label for="ratio">比例</label><select id="ratio"><option value="1:1">1:1</option><option value="3:4" selected>3:4</option><option value="4:3">4:3</option><option value="16:9">16:9</option><option value="9:16">9:16</option></select></div><div><label for="model">模型</label><select id="model"><option value="grok-4.2-image" selected>grok-4.2-image</option><option value="grok-4.1-image">grok-4.1-image</option><option value="grok-4-image">grok-4-image</option></select></div></div>
      <div class="actions"><button class="primary" id="pickDirBtn">选择本地目录</button><button class="primary" id="generateBtn">发送请求</button><button class="ghost" id="clearBtn">清空历史</button><div class="status" id="status">等待生成。</div></div>
    </section>
    <section class="panel gallery"><div class="stream-header"><div><h2>历史流</h2><p>每张图都可以继续编辑。</p></div></div><div id="cards" class="cards"></div><div id="empty" class="empty">还没有生成记录。先来打一张图试试。</div></section>
  </div></div>
  <script>
    const ratioToSize={ '1:1':'960x960','3:4':'1536x2048','4:3':'2048x1536','16:9':'2048x1152','9:16':'1152x2048' };
    const STORAGE_KEY='grok-image-gen-history-v4', SETTINGS_KEY='grok-image-gen-settings-v4';
    const apiBaseEl=document.getElementById('apiBase'), apiKeyEl=document.getElementById('apiKey'), modeEl=document.getElementById('mode'), promptEl=document.getElementById('prompt'), imageInputEl=document.getElementById('imageInput'), imageStateEl=document.getElementById('imageState'), previewEl=document.getElementById('preview'), ratioEl=document.getElementById('ratio'), modelEl=document.getElementById('model'), pickDirBtn=document.getElementById('pickDirBtn'), generateBtn=document.getElementById('generateBtn'), clearBtn=document.getElementById('clearBtn'), statusEl=document.getElementById('status'), cardsEl=document.getElementById('cards'), emptyEl=document.getElementById('empty');
    let currentEditFile = null;
    let imageDirectoryHandle = null;
    function loadHistory(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return[]} }
    function saveHistory(items){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)) }
    function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify({ apiBase:apiBaseEl.value, apiKey:apiKeyEl.value, mode:modeEl.value, prompt:promptEl.value, ratio:ratioEl.value, model:modelEl.value })) }
    function loadSettings(){ try{ const data=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'); if(data.apiBase) apiBaseEl.value=data.apiBase; if(data.apiKey) apiKeyEl.value=data.apiKey; if(data.mode) modeEl.value=data.mode; if(data.prompt) promptEl.value=data.prompt; if(data.ratio) ratioEl.value=data.ratio; if(data.model) modelEl.value=data.model; }catch{} }
    async function pickDirectory(){ if(!window.showDirectoryPicker){ statusEl.textContent='当前浏览器不支持本地目录授权，请使用较新的 Chromium 浏览器。'; return; } try{ imageDirectoryHandle = await window.showDirectoryPicker(); statusEl.textContent=`已授权本地目录：${imageDirectoryHandle.name}`; } catch(e){ statusEl.textContent='你取消了目录授权。'; } }
    async function saveImageToAuthorizedDirectory(imageUrl, filename){ if(!imageDirectoryHandle) return null; const resp = await fetch(imageUrl); const blob = await resp.blob(); const fileHandle = await imageDirectoryHandle.getFileHandle(filename, { create: true }); const writable = await fileHandle.createWritable(); await writable.write(blob); await writable.close(); return { filename, fileHandle }; }
    async function reopenLocalFile(historyItem){ if(historyItem.imageDataUrl){ return dataUrlToFile(historyItem.imageDataUrl, historyItem.localFilename || historyItem.sourceName || 'history-image.png'); } if(imageDirectoryHandle && historyItem.localFilename){ const fileHandle = await imageDirectoryHandle.getFileHandle(historyItem.localFilename); const file = await fileHandle.getFile(); return new File([await file.arrayBuffer()], historyItem.localFilename, { type: file.type || 'image/png' }); } return null; }
    function escapeHtml(str){ return str.replace(/[&<>"]/g, tag=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[tag])) }
    function setPreview(src){ if(!src){ previewEl.style.display='none'; previewEl.removeAttribute('src'); imageStateEl.textContent='尚未载入图片。'; return; } previewEl.src=src; previewEl.style.display='block'; }
    function renderHistory(){ const items=loadHistory(); cardsEl.innerHTML=items.map((item,index)=>`<article class="card"><img src="${item.imageUrl}" alt="generated image" /><div class="prompt">${escapeHtml(item.prompt)}</div><div class="meta-line"><span>${item.modeLabel}</span><span>${item.model}</span></div><div class="meta-line" style="margin-top:6px;"><span>${item.ratio} · ${item.size}</span><span>${item.createdAt}</span></div><div class="meta-line" style="margin-top:6px;"><span>${item.sourceName||'无输入图'}</span><a href="${item.imageUrl}" target="_blank" style="color:#7dd3fc;text-decoration:none;">查看原图</a></div><div class="meta-line" style="margin-top:6px;"><span style="max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;">${escapeHtml(item.imageUrl)}</span></div><div class="card-actions"><button class="mini" onclick="editFromHistory(${index})">编辑此图</button><button class="mini" onclick="downloadImage(${index})">下载到本地</button><button class="mini" onclick="copyImageUrl(${index})">复制图片地址</button><button class="mini" onclick="removeHistoryItem(${index})">删除记录</button></div></article>`).join(''); emptyEl.style.display=items.length?'none':'grid'; }
    function dataUrlToFile(dataUrl, filename){ const parts=dataUrl.split(','); const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/png'; const binary=atob(parts[1]); const array=new Uint8Array(binary.length); for(let i=0;i<binary.length;i++) array[i]=binary.charCodeAt(i); return new File([array], filename, {type:mime}); }
    function blobToDataUrl(blob){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(blob); }); }
    window.editFromHistory=async function(index){ const item=loadHistory()[index]; if(!item) return; modeEl.value='i2i'; promptEl.value=item.prompt; ratioEl.value=item.ratio; modelEl.value=item.model; statusEl.textContent='已带入历史图片，继续编辑即可。'; setPreview(item.imageUrl); const file = await reopenLocalFile(item); if(!file){ statusEl.textContent='无法从本地缓存恢复这张图，请重新上传图片或先重新生成新图。'; return; } currentEditFile = file; imageStateEl.textContent=`已从本地记录载入图片：${file.name}`; try { const dt=new DataTransfer(); dt.items.add(file); imageInputEl.files=dt.files; } catch {} saveSettings(); };
    window.downloadImage=async function(index){ const item=loadHistory()[index]; if(!item) return; const response=await fetch(item.imageUrl); const blob=await response.blob(); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=item.sourceName||`grok-image-${index+1}.png`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); statusEl.textContent='已开始下载图片到本地。'; };
    window.copyImageUrl=async function(index){ const item=loadHistory()[index]; if(!item) return; await navigator.clipboard.writeText(item.imageUrl); statusEl.textContent='图片地址已复制。'; };
    window.removeHistoryItem=function(index){ const items=loadHistory(); if(!items[index]) return; items.splice(index,1); saveHistory(items); renderHistory(); statusEl.textContent='已删除历史记录。'; };
    imageInputEl.addEventListener('change',()=>{ const file=imageInputEl.files?.[0]; currentEditFile = file || null; if(!file){ setPreview(''); return;} imageStateEl.textContent=`已手动选择图片：${file.name}`; setPreview(URL.createObjectURL(file)); });
    async function generateImage(){ const apiBase=apiBaseEl.value.trim().replace(/\/$/, ''), apiKey=apiKeyEl.value.trim(), prompt=promptEl.value.trim(), ratio=ratioEl.value, size=ratioToSize[ratio]||'960x960', model=modelEl.value.trim()||'grok-4.2-image', mode=modeEl.value; const file=currentEditFile || imageInputEl.files?.[0] || null; if(!apiKey) return statusEl.textContent='请先填写 API Key（仅首次需要）。'; if(!prompt) return statusEl.textContent='请先填写提示词。'; if(mode==='i2i'&&!file) return statusEl.textContent='图生图 / 编辑模式需要先上传一张图片。'; saveSettings(); generateBtn.disabled=true; statusEl.textContent=mode==='i2i'?'正在发送编辑请求…':'正在发送生成请求…';
      try{ let response; if(mode==='i2i'){ const form=new FormData(); form.append('image', file); form.append('prompt', prompt); form.append('model', model); form.append('n', '1'); form.append('size', size); response=await fetch(`${apiBase}/v1/images/edits`,{ method:'POST', headers:{ 'Authorization': `Bearer ${apiKey}`, 'Accept':'application/json' }, body:form }); } else { response=await fetch(`${apiBase}/v1/images/generations`,{ method:'POST', headers:{ 'Authorization': `Bearer ${apiKey}`, 'Content-Type':'application/json' }, body:JSON.stringify({ model,prompt,size }) }); }
        if(!response.ok){ const text=await response.text(); throw new Error(text||`HTTP ${response.status}`); }
        const data=await response.json(); const imageUrl=data?.data?.[0]?.url||data?.url||(data?.data?.[0]?.b64_json?`data:image/png;base64,${data.data[0].b64_json}`:''); if(!imageUrl) throw new Error('响应里没有图片 URL / base64'); let imageDataUrl=''; let localFilename=''; try { if(imageUrl.startsWith('data:')) { imageDataUrl=imageUrl; } else { const imageResp=await fetch(imageUrl); const imageBlob=await imageResp.blob(); imageDataUrl=await blobToDataUrl(imageBlob); } } catch {} try { if(imageDirectoryHandle && imageUrl && !imageUrl.startsWith('data:')) { localFilename = `${Date.now()}-${(prompt || 'image').slice(0,16).replace(/[^a-zA-Z0-9_-]/g,'_') || 'image'}.png`; await saveImageToAuthorizedDirectory(imageUrl, localFilename); } } catch {} const items=loadHistory(); items.unshift({ prompt,ratio,size,model,modeLabel:mode==='i2i'?'图生图 / 编辑':'文生图',sourceName:file?.name||'',imageUrl,imageDataUrl,localFilename,createdAt:new Date().toLocaleString('zh-CN') }); saveHistory(items); renderHistory(); statusEl.textContent=localFilename ? `生成成功，图片已保存到本地目录：${localFilename}` : '生成成功，图片已加入历史流。';
      }catch(error){ console.error(error); statusEl.textContent=`请求失败：${String(error.message||error).slice(0,140)}`; } finally{ generateBtn.disabled=false; } }
    pickDirBtn.addEventListener('click', pickDirectory); generateBtn.addEventListener('click', generateImage); clearBtn.addEventListener('click',()=>{ localStorage.removeItem(STORAGE_KEY); renderHistory(); statusEl.textContent='历史已清空。'; }); [apiBaseEl,apiKeyEl,modeEl,promptEl,ratioEl,modelEl].forEach(el=>{ el.addEventListener('change',saveSettings); el.addEventListener('input',saveSettings); }); loadSettings(); renderHistory(); if(apiKeyEl.value) statusEl.textContent='已从 localStorage 恢复 API Key。';
  </script>
</body>
</html>
