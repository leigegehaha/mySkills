<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grok Video 3 Tester</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="grain"></div>
    <main class="shell">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Grok Video 3 Lab</p>
          <h1>文生视频 / 图生视频 的本地测试台</h1>
          <p class="lede">提交任务、观察进度、回看成片。历史记录采用流式瀑布布局，像剪辑墙一样自然铺开。</p>
        </div>
        <div class="hero-stat">
          <span>实时</span>
          <strong id="jobCount">0</strong>
          <small>历史任务</small>
        </div>
      </section>

      <section class="panel composer">
        <div class="mode-switch">
          <button class="mode-chip active" data-mode="text">文生视频</button>
          <button class="mode-chip" data-mode="image">图生视频</button>
        </div>

        <form id="generateForm" class="form-grid">
          <label class="field field-wide">
            <span>提示词</span>
            <textarea id="prompt" rows="5" placeholder="描述镜头、动作、风格、运镜……" required></textarea>
          </label>

          <label class="field image-only hidden">
            <span>选择本地图片</span>
            <input id="imageFile" type="file" accept="image/png,image/jpeg,image/jpg,image/webp,image/gif" />
          </label>

          <label class="field image-only hidden">
            <span>或填写远程图片 URL</span>
            <input id="imagePath" type="text" placeholder="https://example.com/test.png" />
          </label>

          <label class="field">
            <span>比例</span>
            <select id="aspectRatio">
              <option>3:2</option>
              <option>16:9</option>
              <option>9:16</option>
              <option>1:1</option>
              <option>4:3</option>
              <option>3:4</option>
              <option>2:3</option>
            </select>
          </label>

          <label class="field">
            <span>清晰度</span>
            <select id="size">
              <option>720P</option>
              <option>1080P</option>
            </select>
          </label>

          <label class="field">
            <span>时长</span>
            <select id="duration">
              <option value="6">6 秒</option>
              <option value="10">10 秒</option>
              <option value="15">15 秒</option>
            </select>
          </label>

          <div class="actions">
            <button id="submitButton" type="submit">开始生成</button>
            <p id="statusText">等待提交</p>
          </div>
        </form>
      </section>

      <section class="history-head">
        <div>
          <p class="eyebrow">History Stream</p>
          <h2>生成历史</h2>
          <p class="history-summary">累计生成耗时：<strong id="totalGenerationTime">0 秒</strong></p>
        </div>
        <button id="refreshButton" class="ghost">刷新</button>
      </section>

      <section id="historyGrid" class="history-grid"></section>
    </main>
    <script src="/app.js"></script>
  </body>
  </html>
